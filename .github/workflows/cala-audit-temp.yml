name: Audit temporaire CALA

on:
  push:
    branches: [cala-audit-temp]
    paths:
      - 'cala-audit/**'
      - '.github/workflows/cala-audit-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cala-audit-temp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests osmium
      - name: Décoder le script
        run: |
          base64 -d cala-audit/process.py.gz.b64 | gzip -d > cala-audit/process.py
      - name: Lancer l'audit
        run: python cala-audit/process.py
      - name: Publier les résultats dans la branche temporaire
        run: |
          git config user.name 'CALA audit bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cala-audit/results
          git commit -m 'Résultats audit CALA' || exit 0
          git push origin cala-audit-temp
